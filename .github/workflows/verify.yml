name: Verify ledger
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: utility-sync
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen pytest
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: utility-tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '24'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: ./gradlew :app:testAcceptanceUnitTest :app:assembleDebug :app:assembleAcceptanceAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: utility-tracker-apk
          path: utility-tracker/app/build/outputs/apk/debug/app-debug.apk
